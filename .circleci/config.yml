version: 2.1

executors:
  custom-executor:
    docker:
      # Pinned, and without -browsers. The Lambda runtime is nodejs12.x, so CI
      # should be Node 12 rather than a floating lts tag that can drift onto a
      # different major than production runs. Nothing here drives a browser, so the
      # Chrome and Firefox layers in the -browsers variant were dead weight.
      - image: circleci/node:12.16
    working_directory: ~/project

jobs:
  build:
    executor: custom-executor
    steps:
      - checkout
      - restore_cache:
          key: yarn-cache-{{ checksum "src/yarn.lock" }}
      - run:
          name: Installing serverless and plugins
          # Installed in src/, because that is where the dependencies are declared
          # and where the deploy job runs ./node_modules/.bin/serverless. The old
          # config installed at the repository root, whose package.json declares no
          # dependencies at all, so the binary deploy invokes never existed.
          #
          # yarn with the committed yarn.lock, not npm: --frozen-lockfile installs
          # exactly the tree this project was built against and fails rather than
          # silently re-resolving. Node 12 ships npm 6, which cannot read a modern
          # lockfileVersion 3 file, so generating a package-lock here would have
          # broken this job.
          command: |
            cd src/
            yarn install --frozen-lockfile
      - save_cache:
          key: yarn-cache-{{ checksum "src/yarn.lock" }}
          # The package cache, not node_modules: the install step recreates
          # node_modules regardless, so caching it saves nothing.
          paths:
            - ~/.cache/yarn
      - persist_to_workspace:
          root: ~/project
          # `app` used to be listed here and has never existed in this repository.
          # src carries both the source and the installed framework.
          paths:
            - src

  test:
    executor: custom-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Test
          # Placeholder. Note that deploy depends on this job, so it is a gate that
          # currently always opens.
          command: echo "Run some tests..."

  lint:
    executor: custom-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: Lint
          command: echo "Linting..."

  deploy:
    executor: custom-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - run:
          name: SLS deploy
          # Credentials come from the standard AWS environment variables, which is
          # why serverless.yml no longer pins a local `profile:`. Set these in the
          # CircleCI project (or a context) before this can succeed:
          #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
          # The deploy role also needs ssm:GetParameter for
          # /AllEnvironments/certificateARN, or set CERTIFICATE_ARN to skip the
          # lookup. See the README.
          command: |
            cd src/
            ./node_modules/.bin/serverless deploy -v

workflows:
  version: 2
  build_test_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - lint:
          requires:
            - build
      - deploy:
          requires:
            - build
            - test
          filters:
            branches:
              only: master
